<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a718f"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="718" rx="18" fill="#f8faf9" stroke="#dfe5ea"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#14532d">Cola durable en MariaDB con trabajador por cron</text>

  <!-- Usuario -->
  <rect x="40" y="80" width="250" height="120" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="165" y="114" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">Usuario (HTMX)</text>
  <text x="165" y="142" text-anchor="middle" font-size="14" fill="#1a2938">POST importar o exportar</text>
  <text x="165" y="164" text-anchor="middle" font-size="14" fill="#1a2938">X-Idempotency-Key</text>
  <text x="165" y="186" text-anchor="middle" font-size="14" fill="#1a2938">CSRF · permiso</text>

  <!-- Despachador -->
  <rect x="380" y="80" width="300" height="120" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="530" y="114" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">DespachadorCola</text>
  <text x="530" y="142" text-anchor="middle" font-size="14" fill="#1a2938">Valida y persiste (outbox)</text>
  <text x="530" y="164" text-anchor="middle" font-size="14" fill="#1a2938">Duplicado: devuelve el existente</text>
  <text x="530" y="186" text-anchor="middle" font-size="14" fill="#1a2938">202 + Location + Retry-After</text>

  <!-- Tabla trabajos -->
  <rect x="770" y="80" width="390" height="190" rx="14" fill="#eef3f7" stroke="#4a718f" stroke-width="2"/>
  <text x="965" y="114" text-anchor="middle" font-size="19" font-weight="700" fill="#4a718f">Tabla trabajos (MariaDB)</text>
  <g font-size="14" fill="#1a2938">
    <text x="790" y="146">pendiente → reservado → completado</text>
    <text x="790" y="170">                     ↘ reprogramado (espera exponencial)</text>
    <text x="790" y="194">                     ↘ fallido → trabajos_fallidos</text>
    <text x="790" y="222">bloqueado_hasta · reservado_por (token)</text>
    <text x="790" y="246">clave_idempotencia única · punto_control</text>
  </g>

  <!-- Cron -->
  <rect x="40" y="330" width="250" height="120" rx="14" fill="#fff6e6" stroke="#d97706" stroke-width="2"/>
  <text x="165" y="364" text-anchor="middle" font-size="19" font-weight="700" fill="#b45309">Cron de hPanel</text>
  <text x="165" y="392" text-anchor="middle" font-size="14" fill="#1a2938">Cada minuto, más un</text>
  <text x="165" y="414" text-anchor="middle" font-size="14" fill="#1a2938">desfase de 30 s</text>
  <text x="165" y="436" text-anchor="middle" font-size="14" fill="#1a2938">Máximo 2 trabajadores (flock)</text>

  <!-- Trabajador -->
  <rect x="380" y="310" width="300" height="230" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="530" y="344" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">trabajador_cron.php</text>
  <g font-size="14" fill="#1a2938">
    <text x="400" y="376">1. Recuperar reservas vencidas</text>
    <text x="400" y="402">2. Reclamar lote: FOR UPDATE</text>
    <text x="418" y="424">SKIP LOCKED (transacción corta)</text>
    <text x="400" y="450">3. Ejecutar fuera de la transacción</text>
    <text x="400" y="476">4. Completar si la reserva es suya</text>
    <text x="400" y="502">5. Presupuesto de 50 s · memoria</text>
    <text x="400" y="528">6. Mantenimiento: solo técnicos</text>
  </g>

  <!-- Externo -->
  <rect x="770" y="330" width="390" height="110" rx="14" fill="#ffffff" stroke="#4a718f" stroke-width="2"/>
  <text x="965" y="364" text-anchor="middle" font-size="19" font-weight="700" fill="#4a718f">Manejadores idempotentes</text>
  <text x="965" y="392" text-anchor="middle" font-size="14" fill="#1a2938">Correo (cortacircuitos 3 fallos / 60 s)</text>
  <text x="965" y="414" text-anchor="middle" font-size="14" fill="#1a2938">Importación por bloques · XLSX · PDF</text>

  <!-- Seguimiento -->
  <rect x="40" y="570" width="640" height="110" rx="14" fill="#ecf6ef" stroke="#15803d" stroke-width="2"/>
  <text x="360" y="604" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">ControladorTrabajos · fragmento de estado</text>
  <text x="360" y="632" text-anchor="middle" font-size="14" fill="#1a2938">Solo el actor de su centro · consulta cada 2, 3, 5, 8, 13 y 15 s</text>
  <text x="360" y="656" text-anchor="middle" font-size="14" fill="#1a2938">Pausa con la pestaña oculta · 286 y sin disparador al terminar · se detiene en 503</text>

  <rect x="770" y="490" width="390" height="190" rx="14" fill="#fdf0f0" stroke="#c34747" stroke-width="2"/>
  <text x="965" y="524" text-anchor="middle" font-size="19" font-weight="700" fill="#c34747">Garantías declaradas</text>
  <g font-size="14" fill="#1a2938">
    <text x="790" y="556">• Entrega al menos una vez</text>
    <text x="790" y="582">• Sin promesa de exactamente una vez</text>
    <text x="790" y="608">• Sin bloqueos durante llamadas externas</text>
    <text x="790" y="634">• Alertas: pendiente de más de 5 min, latido</text>
    <text x="790" y="660">  de más de 3 min, más de 5 fallidos por hora</text>
  </g>

  <g stroke="#4a718f" stroke-width="2.5" fill="none">
    <path d="M290 140 L375 140" marker-end="url(#flecha)"/>
    <path d="M680 140 L765 140" marker-end="url(#flecha)"/>
    <path d="M290 390 L375 400" marker-end="url(#flecha)"/>
    <path d="M680 360 L765 250" marker-end="url(#flecha)"/>
    <path d="M680 420 L765 400" marker-end="url(#flecha)"/>
    <path d="M530 540 L530 565" marker-end="url(#flecha)"/>
    <path d="M40 625 L20 625 L20 140 L35 140" marker-end="url(#flecha)" stroke-dasharray="7 6"/>
  </g>
  <text x="48" y="268" font-size="14" fill="#5f6b76">Consulta periódica del estado</text>
</svg>
