; KORA — ajustes de PHP para LiteSpeed (Hostinger). Verificar en la I0 que el plan respeta .user.ini (ítem 5 del
; 4.8); si no, fijar los mismos valores en hPanel → Avanzado → Configuración de PHP.
; En MAMP (Apache con mod_php) este archivo no se lee; los equivalentes locales están en el php.ini de MAMP.
display_errors = Off
log_errors = On
expose_php = Off
memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 10M
post_max_size = 12M
max_input_vars = 2000
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
zend.exception_ignore_args = On
