openapi: 3.1.0
info:
  title: KORA — integración con el software de ventas
  version: 1.0.0
  summary: Contrato para recibir recepciones de lotes y salidas (ventas y autoconsumos) (RF-095 a RF-098, Anexo E).
  description: |
    Contrato documentado de la v1. El endpoint operativo (RF-098) queda fuera de la v1: mientras tanto, el software de
    ventas entrega un XLSX o CSV con estas mismas columnas, que se importa con el módulo asistido (fuentes 5 y 6,
    RF-096). Los registros se relacionan solo por claves de unidad, producto, lote y proceso, más el identificador
    externo único de cada salida; está prohibido unir tablas transaccionales por nombre o por fecha (RF-097).
servers:
  - url: https://kora.example/api/v1
    description: Ilustrativo; el dominio real lo fija la puesta en producción (I8).
security:
  - firmaHmac: []
paths:
  /integracion/ventas/lotes:
    post:
      operationId: recibirLote
      summary: Recibe un lote de recepciones y salidas.
      description: |
        Respuesta 202: el lote queda en una bandeja de entrada durable y se procesa con la cola (`importacion.validar` y
        `importacion.aplicar`). Repetir la misma clave de idempotencia devuelve el mismo lote sin duplicar.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - $ref: '#/components/parameters/Marca'
        - $ref: '#/components/parameters/Firma'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoteIntegracion'
      responses:
        '202':
          description: Lote aceptado para validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoteAceptado'
        '400':
          $ref: '#/components/responses/Problema'
        '401':
          $ref: '#/components/responses/Problema'
        '409':
          description: La clave de idempotencia ya se usó con otro contenido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/Problema'
  /integracion/ventas/lotes/{ulid}:
    get:
      operationId: consultarLote
      summary: Estado y resumen de un lote recibido.
      parameters:
        - name: ulid
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        - $ref: '#/components/parameters/Marca'
        - $ref: '#/components/parameters/Firma'
      responses:
        '200':
          description: Estado del lote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoLote'
        '404':
          $ref: '#/components/responses/Problema'
components:
  securitySchemes:
    firmaHmac:
      type: apiKey
      in: header
      name: X-Kora-Firma
      description: |
        HMAC-SHA256 en hexadecimal de `{X-Kora-Marca}.{cuerpo}` con el secreto compartido del cliente. La marca de
        tiempo (segundos Unix) no puede diferir más de 300 s del reloj del servidor.
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{16,120}$'
    Marca:
      name: X-Kora-Marca
      in: header
      required: true
      schema:
        type: integer
    Firma:
      name: X-Kora-Firma
      in: header
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
  responses:
    Problema:
      description: Error con detalle por campo (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    Medida:
      type: string
      enum: [L, kg, ud, lb, cubeta]
    Fecha:
      type: string
      format: date
    Decimal3:
      type: string
      pattern: '^\d{1,11}(\.\d{1,3})?$'
      description: Cantidad no negativa como texto, sin separadores de miles.
    Monto:
      type: string
      pattern: '^\d{1,13}(\.\d{1,2})?$'
    Recepcion:
      type: object
      additionalProperties: false
      required: [numero_interno, fecha_recepcion, unidad, codigo_sgac, cantidad, medida]
      properties:
        numero_interno:
          type: string
          pattern: '^[A-Z0-9]{2,8}-(REC|DEV)-\d{6}-\d{3,4}$'
          description: Clave natural junto con el código SGAC y la unidad (RF-089).
        fecha_recepcion:
          $ref: '#/components/schemas/Fecha'
        unidad:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Código de la unidad productiva (GAN, AGR…).
        codigo_sgac:
          type: string
          pattern: '^\d{6,20}$'
        cantidad:
          $ref: '#/components/schemas/Decimal3'
        medida:
          $ref: '#/components/schemas/Medida'
        precio_sugerido:
          $ref: '#/components/schemas/Monto'
        responsable:
          type: string
          maxLength: 150
    Salida:
      type: object
      additionalProperties: false
      required: [id_externo, numero_interno, fecha, cantidad, medida, precio_unitario, canal]
      properties:
        id_externo:
          type: string
          minLength: 1
          maxLength: 80
          description: Identificador único del software de ventas; una salida sin él se rechaza (RF-097).
        numero_interno:
          type: string
          description: Lote del que sale; se vincula por número y código, nunca por nombre.
        codigo_sgac:
          type: string
          pattern: '^\d{6,20}$'
        fecha:
          $ref: '#/components/schemas/Fecha'
        cantidad:
          $ref: '#/components/schemas/Decimal3'
        medida:
          $ref: '#/components/schemas/Medida'
        precio_unitario:
          $ref: '#/components/schemas/Monto'
        canal:
          type: string
          enum: [VENTA_DIRECTA, AUTOCONSUMO]
        proceso:
          type: string
          pattern: '^AUTO_\d+$'
          description: Obligatorio en autoconsumo; coherente con unidad, medida, vigencia y producto (RF-043).
        factura:
          type: string
          maxLength: 40
        referencia_transaccion:
          type: string
          maxLength: 80
      allOf:
        - if:
            properties:
              canal:
                const: AUTOCONSUMO
          then:
            required: [proceso]
    LoteIntegracion:
      type: object
      additionalProperties: false
      required: [centro, recepciones, salidas]
      properties:
        centro:
          type: string
          const: '9124'
        recepciones:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Recepcion'
        salidas:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Salida'
    LoteAceptado:
      type: object
      required: [ulid, estado, url_estado]
      properties:
        ulid:
          type: string
        estado:
          type: string
          enum: [validando]
        url_estado:
          type: string
          format: uri-reference
    EstadoLote:
      type: object
      required: [ulid, estado]
      properties:
        ulid:
          type: string
        estado:
          type: string
          enum: [validando, validado, con_errores, aplicando, aplicado, revertido, fallido]
        filas_validas:
          type: integer
        filas_error:
          type: integer
    Problema:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        errores:
          type: array
          items:
            type: object
            required: [campo, mensaje]
            properties:
              indice:
                type: integer
              campo:
                type: string
              mensaje:
                type: string
