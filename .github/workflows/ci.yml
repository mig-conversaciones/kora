# Integración continua de KORA (ROB-001).
# Las pruebas de integración y las migraciones corren contra MariaDB 10.6 (producción) y MySQL 5.7 (paridad
# con el MAMP local), según ADR-002.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP (${{ matrix.motor.nombre }})
    runs-on: ubuntu-24.04
    strategy:
      # Sin fail-fast: si un motor falla, el otro termina y muestra si el fallo es propio de ese motor.
      fail-fast: false
      matrix:
        motor:
          - { nombre: 'MariaDB 10.6', imagen: 'mariadb:10.6', skip_locked: 'true', reclamo: 'skip_locked' }
          - { nombre: 'MySQL 5.7', imagen: 'mysql:5.7', skip_locked: 'false', reclamo: 'actualizacion_condicional' }
    services:
      bd:
        image: ${{ matrix.motor.imagen }}
        env:
          MYSQL_ROOT_PASSWORD: raiz_ci
          MARIADB_ROOT_PASSWORD: raiz_ci
          MYSQL_DATABASE: kora_pruebas
          MYSQL_USER: kora_app
          MYSQL_PASSWORD: clave_ci
          MARIADB_DATABASE: kora_pruebas
          MARIADB_USER: kora_app
          MARIADB_PASSWORD: clave_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -praiz_ci || mariadb-admin ping -h 127.0.0.1 -uroot -praiz_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, sodium, zip, fileinfo, openssl
          coverage: pcov
      - name: Dependencias
        run: composer install --no-interaction --no-progress
      - name: Auditoría de dependencias (RS-015)
        run: composer audit
      - name: Entorno de CI
        run: |
          cp .env.example .env
          sed -i "s#^APP_ENTORNO=.*#APP_ENTORNO=local#; s#^APP_URL=.*#APP_URL=http://localhost#; s#^BD_NOMBRE=.*#BD_NOMBRE=kora_pruebas#; s#^BD_USUARIO=.*#BD_USUARIO=kora_app#; s#^BD_CONTRASENA=.*#BD_CONTRASENA=clave_ci#; s#^BD_SKIP_LOCKED=.*#BD_SKIP_LOCKED=${{ matrix.motor.skip_locked }}#; s#^COLA_ESTRATEGIA_RECLAMO=.*#COLA_ESTRATEGIA_RECLAMO=${{ matrix.motor.reclamo }}#; s#^CORREO_TRANSPORTE=.*#CORREO_TRANSPORTE=archivo#" .env
          sed -i "s#REEMPLAZAR_CON_32_BYTES_EN_BASE64#$(php -r 'echo base64_encode(random_bytes(32));')#g; s#REEMPLAZAR_CON_64_CARACTERES_HEX#$(php -r 'echo bin2hex(random_bytes(32));')#" .env
      - name: Estilo PSR-12
        run: composer estilo
      - name: Análisis estático (PHPStan nivel 6)
        run: composer analizar
      - name: Migraciones de ida y vuelta (RBD-011)
        run: |
          php cli/migrar.php --aplicar --base=kora_pruebas
          php cli/migrar.php --revertir=100 --base=kora_pruebas
          php cli/migrar.php --aplicar --base=kora_pruebas
      - name: Pruebas unitarias y de integración
        run: vendor/bin/phpunit --log-junit junit.xml
      - name: Anotar las pruebas fallidas
        if: failure()
        run: php .github/anotar-junit.php junit.xml

  activos:
    name: Activos y JavaScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias (RS-015)
        run: npm audit --omit=dev --audit-level=high
      - name: ESLint (no-alert, no-console)
        run: npm run lint:js
      - name: Contraste AA de los tokens (RUI-003)
        run: npm run contraste
      - name: Construcción con presupuesto de peso (RNF-019, RNF-PERF-020)
        run: npm run construir

  operacion:
    # Ensayo de operación en Linux real (I7): empaquetado con manifiesto, despliegue con enlace atómico y mantenimiento,
    # reversión, simulacro de restauración con cifras de control y verificación de integridad (ROB-001 a ROB-005,
    # ROB-013, RDL-004, RDL-005, RS-022). Es el equivalente en la CI del ensayo que se repite en staging.
    name: Despliegue, reversión y restauración (MariaDB 10.6)
    runs-on: ubuntu-24.04
    services:
      bd:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: raiz_ci
          MARIADB_DATABASE: kora
          MARIADB_USER: kora_app
          MARIADB_PASSWORD: clave_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -praiz_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      RAIZ_APP: /tmp/kora
    defaults:
      run:
        # Cada paso deja su salida en un registro: si algo falla, el último paso la publica como anotación, que se lee
        # sin autenticación por la API de check-runs (los registros de Actions sí la exigen).
        shell: bash .github/ejecutar-registrado.sh {0}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, sodium, zip, fileinfo, openssl, opcache
          ini-values: opcache.enable_cli=1
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cliente de MariaDB (mariadb-dump, como en Hostinger)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
      - name: Base aislada para el simulacro de restauración
        run: |
          mariadb -h127.0.0.1 -uroot -praiz_ci -e "CREATE DATABASE kora_restauracion CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL ON kora_restauracion.* TO 'kora_app'@'%';"
      - name: Paquetes de dos versiones (ROB-001, paso 7)
        run: |
          bash scripts/empaquetar.sh v0.8.0-ci1 /tmp/kora-v1.tar.gz
          bash scripts/empaquetar.sh v0.8.0-ci2 /tmp/kora-v2.tar.gz
          tar -tzf /tmp/kora-v1.tar.gz | grep -qx './manifiesto.sha256'
          ! tar -tzf /tmp/kora-v1.tar.gz | grep -qE '^\./(\.env|referencias/|tests/|almacenamiento/)'
      - name: Estructura compartida, .env de staging y llaves del custodio
        run: |
          mkdir -p $RAIZ_APP/releases $RAIZ_APP/respaldos
          mkdir -p $RAIZ_APP/compartido/almacenamiento/{cache,registros,estado,importaciones,exportaciones,adjuntos,latidos,bloqueos,correos}
          php -r '$p = sodium_crypto_box_keypair(); file_put_contents("/tmp/custodio.par", base64_encode($p)); file_put_contents("/tmp/custodio.publica", base64_encode(sodium_crypto_box_publickey($p)));'
          ENV=$RAIZ_APP/compartido/.env
          cp .env.example $ENV
          sed -i "s#^APP_ENTORNO=.*#APP_ENTORNO=staging#; s#^APP_URL=.*#APP_URL=https://staging.kora.invalid#; s#^BD_NOMBRE=.*#BD_NOMBRE=kora#; s#^BD_USUARIO=.*#BD_USUARIO=kora_app#; s#^BD_CONTRASENA=.*#BD_CONTRASENA=clave_ci#; s#^CORREO_TRANSPORTE=.*#CORREO_TRANSPORTE=archivo#" $ENV
          sed -i "s#^RESPALDO_MYSQLDUMP=.*#RESPALDO_MYSQLDUMP=mariadb-dump#; s#^RESPALDO_MYSQL=.*#RESPALDO_MYSQL=mariadb#; s#^RESPALDO_DIRECTORIO=.*#RESPALDO_DIRECTORIO=$RAIZ_APP/respaldos#; s#^RESPALDO_LLAVE_PUBLICA=.*#RESPALDO_LLAVE_PUBLICA=$(cat /tmp/custodio.publica)#" $ENV
          sed -i "s#REEMPLAZAR_CON_32_BYTES_EN_BASE64#$(php -r 'echo base64_encode(random_bytes(32));')#g; s#REEMPLAZAR_CON_64_CARACTERES_HEX#$(php -r 'echo bin2hex(random_bytes(32));')#" $ENV
          chmod 600 $ENV
      - name: Primer despliegue (base vacía, sin copia previa)
        run: |
          bash scripts/desplegar.sh v0.8.0-ci1 /tmp/kora-v1.tar.gz
          php $RAIZ_APP/current/cli/sembrar.php
          test "$(readlink $RAIZ_APP/current)" = "releases/v0.8.0-ci1"
      - name: Segundo despliegue con mantenimiento, drenaje y copia previa (ROB-005, RDL-004)
        run: |
          php $RAIZ_APP/current/cli/trabajador_cron.php
          bash scripts/desplegar.sh v0.8.0-ci2 /tmp/kora-v2.tar.gz --con-mantenimiento
          test "$(readlink $RAIZ_APP/current)" = "releases/v0.8.0-ci2"
          php $RAIZ_APP/current/cli/mantenimiento.php estado | grep -q inactivo
          mariadb -h127.0.0.1 -ukora_app -pclave_ci kora -N -e "SELECT COUNT(*) FROM despliegues WHERE resultado = 'exito'" | grep -qx 2
          mariadb -h127.0.0.1 -ukora_app -pclave_ci kora -N -e "SELECT COUNT(*) FROM respaldos WHERE tipo = 'predespliegue' AND estado = 'completado'" | grep -qx 1
          mariadb -h127.0.0.1 -ukora_app -pclave_ci kora -N -e "SELECT COUNT(*) FROM eventos_auditoria WHERE accion = 'sistema.desplegar'" | grep -qx 2
      - name: Reversión en 10 minutos o menos (ROB-004)
        run: |
          php $RAIZ_APP/current/cli/trabajador_cron.php
          INICIO=$(date +%s)
          bash scripts/rollback.sh
          DURACION=$(( $(date +%s) - INICIO ))
          echo "Reversión en ${DURACION} s"
          test "$(readlink $RAIZ_APP/current)" = "releases/v0.8.0-ci1"
          test "$DURACION" -le 600
          mariadb -h127.0.0.1 -ukora_app -pclave_ci kora -N -e "SELECT COUNT(*) FROM eventos_auditoria WHERE accion = 'sistema.revertir'" | grep -qx 1
      - name: Simulacro de restauración con cifras de control y cadena (RDL-005)
        run: |
          php $RAIZ_APP/current/cli/respaldo.php simulacro --identidad=/tmp/custodio.par --base-destino=kora_restauracion --acta=/tmp/acta-restauracion.md
          cat /tmp/acta-restauracion.md >> "$GITHUB_STEP_SUMMARY"
          php $RAIZ_APP/current/cli/respaldo.php listar
      - name: Integridad de la versión activa (RS-022)
        run: |
          php $RAIZ_APP/current/cli/verificar_integridad.php
          echo "// alterado" >> $RAIZ_APP/current/cli/humo.php
          ! php $RAIZ_APP/current/cli/verificar_integridad.php
      - name: Anotar el fallo con las últimas líneas del registro
        if: failure()
        run: |
          php -r '$l = @file("/tmp/operacion.log", FILE_IGNORE_NEW_LINES) ?: ["Sin registro."]; $t = implode("\n", array_slice($l, -80));
            echo "::error title=Trabajo operacion::" . strtr($t, ["%" => "%25", "\r" => "%0D", "\n" => "%0A"]) . "\n";'

  secretos:
    # Búsqueda de secretos en todo el historial (RS-016). Cualquier hallazgo bloquea; el valor nunca se imprime.
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: gitleaks 8.21.2 sobre el historial completo
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 0 --report-format json --report-path /tmp/gitleaks.json
          php .github/evaluar-seguridad.php gitleaks /tmp/gitleaks.json

  navegador:
    # Navegador real contra el servidor embebido de PHP con MariaDB 10.6 y el dataset «mini» (I8):
    #   1. axe WCAG 2.2 AA y CSP en escritorio y móvil, y flujos E2E (RUI-002 a RUI-024, RS-007);
    #   2. OWASP ZAP: baseline sin sesión y escaneo completo autenticado (RS-016). Un riesgo alto bloquea.
    name: Navegador, accesibilidad y ZAP (MariaDB 10.6)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      bd:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: raiz_ci
          MARIADB_DATABASE: kora_pruebas
          MARIADB_USER: kora_app
          MARIADB_PASSWORD: clave_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -praiz_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      KORA_URL: http://127.0.0.1:8080
      KORA_CUENTAS: /tmp/cuentas.json
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, sodium, zip, fileinfo, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias y activos
        run: |
          composer install --no-interaction --no-progress
          npm ci
          npm run construir
          npx playwright install --with-deps chromium
      - name: Entorno de staging local con el dataset «mini»
        run: |
          cp .env.example .env
          sed -i "s#^APP_ENTORNO=.*#APP_ENTORNO=staging#; s#^APP_URL=.*#APP_URL=$KORA_URL#; s#^BD_NOMBRE=.*#BD_NOMBRE=kora_pruebas#; s#^BD_USUARIO=.*#BD_USUARIO=kora_app#; s#^BD_CONTRASENA=.*#BD_CONTRASENA=clave_ci#; s#^CORREO_TRANSPORTE=.*#CORREO_TRANSPORTE=archivo#" .env
          sed -i "s#REEMPLAZAR_CON_32_BYTES_EN_BASE64#$(php -r 'echo base64_encode(random_bytes(32));')#g; s#REEMPLAZAR_CON_64_CARACTERES_HEX#$(php -r 'echo bin2hex(random_bytes(32));')#" .env
          php cli/generar_dataset.php --base=kora_pruebas --escala=mini --preparar --cuentas=30 --usuarios-k6=$KORA_CUENTAS
      - name: Servidor embebido de PHP
        run: |
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8080 -t public tests/seguridad/servidor.php > /tmp/servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -sf $KORA_URL/health/live > /dev/null && break; sleep 1; done
          curl -sf $KORA_URL/health/live
      - name: Accesibilidad WCAG 2.2 AA, CSP y flujos E2E
        run: npx playwright test
      - name: Resumen de axe
        if: always()
        run: |
          php -r '$n = 0; foreach (@file("almacenamiento/construccion/e2e/axe.jsonl") ?: [] as $l) { $r = json_decode($l, true); $n++;
            foreach ($r["violaciones"] as $v) { echo "::error title=axe " . $v["regla"] . "::" . $r["proyecto"] . " " . $r["rol"] . " " . $r["ruta"] . ": " . $v["nodos"] . " nodo(s), " . $v["impacto"] . ", p. ej. " . $v["ejemplo"] . "\n"; } }
            file_put_contents(getenv("GITHUB_STEP_SUMMARY"), "### axe\n{$n} pantallas auditadas (WCAG 2.2 AA).\n\n", FILE_APPEND);'
      - name: Anotar las pruebas de navegador fallidas
        if: failure()
        run: |
          php -r '$d = json_decode((string) @file_get_contents("almacenamiento/construccion/e2e/resultados.json"), true) ?: [];
            $f = function (array $s) use (&$f) { foreach ($s["suites"] ?? [] as $x) { $f($x); } foreach ($s["specs"] ?? [] as $e) { foreach ($e["tests"] ?? [] as $t) { foreach ($t["results"] ?? [] as $r) {
              if (($r["status"] ?? "") !== "passed" && ($r["status"] ?? "") !== "skipped") { $m = substr((string) ($r["error"]["message"] ?? ""), 0, 1500); echo "::error title=E2E " . $t["projectName"] . "::" . strtr($e["title"] . "\n" . $m, ["%" => "%25", "\r" => "%0D", "\n" => "%0A"]) . "\n"; } } } } };
            foreach ($d["suites"] ?? [] as $s) { $f($s); }'
          tail -n 40 /tmp/servidor.log | sed 's/^/servidor: /'
      - name: Sesión para ZAP (ingreso real con CSRF)
        run: |
          CORREO=$(php -r '$c = json_decode(file_get_contents(getenv("KORA_CUENTAS")), true); foreach ($c as $x) { if ($x["rol"] === "lider_produccion_centro" && $x["centro"] === "9124") { echo $x["correo"]; break; } }')
          CLAVE=$(php -r '$c = json_decode(file_get_contents(getenv("KORA_CUENTAS")), true); foreach ($c as $x) { if ($x["rol"] === "lider_produccion_centro" && $x["centro"] === "9124") { echo $x["contrasena"]; break; } }')
          echo "::add-mask::$CLAVE"
          CSRF=$(curl -s -c /tmp/zap.cookies $KORA_URL/ingresar | sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' | head -n1)
          curl -s -b /tmp/zap.cookies -c /tmp/zap.cookies -o /dev/null -w '%{http_code} %{redirect_url}\n' --data-urlencode "_csrf=$CSRF" --data-urlencode "correo=$CORREO" --data-urlencode "contrasena=$CLAVE" -H "Origin: $KORA_URL" $KORA_URL/ingresar
          SESION=$(awk '$6 == "kora_sesion" { print $7 }' /tmp/zap.cookies)
          test -n "$SESION"
          echo "::add-mask::$SESION"
          echo "ZAP_SESION=$SESION" >> "$GITHUB_ENV"
          mkdir -p zap && chmod 777 zap
      - name: ZAP baseline sin sesión
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t "$KORA_URL/ingresar" -J base.json -r base.html -I -m 2
      - name: ZAP escaneo completo autenticado
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-full-scan.py -t "$KORA_URL/" -J completo.json -r completo.html -I -m 3 \
            -z "-config replacer.full_list(0).description=sesion -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Cookie -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=kora_sesion=$ZAP_SESION -config spider.postform=false"
      - name: Evaluar ZAP (un riesgo alto bloquea)
        if: always()
        run: php .github/evaluar-seguridad.php zap zap/base.json zap/completo.json
      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-navegador-zap
          path: |
            zap/*.html
            zap/*.json
            almacenamiento/construccion/e2e/axe.jsonl
            almacenamiento/construccion/e2e/resultados.json
          retention-days: 30
